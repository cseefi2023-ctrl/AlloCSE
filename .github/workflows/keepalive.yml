# Les projets Supabase gratuits se mettent en pause après 7 jours sans activité.
# Ce petit appel tous les 3 jours garde chaque espace éveillé (il ne lit que la configuration publique).
name: Garder Supabase éveillé

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Appel de public_config pour chaque espace
        run: |
          status=0
          node scripts/espaces.mjs > espaces.txt
          [ -s espaces.txt ] || { echo "config.js pas encore renseigné"; exit 0; }
          while read -r KEY URL APIKEY DEMO; do
            if curl -fsS -X POST "$URL/rest/v1/rpc/public_config" \
                 -H "apikey: $APIKEY" -H "Content-Type: application/json" -d '{}' > /dev/null; then
              echo "Espace $KEY : Supabase répond."
            else
              echo "::warning::Espace $KEY : pas de réponse."; status=1
            fi
          done < espaces.txt
          exit $status
